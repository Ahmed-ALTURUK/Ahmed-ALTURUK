name: Generate Stats and Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create dist directory
        run: mkdir -p dist

      - name: Download GitHub Stats SVG
        run: curl -s "https://github-readme-stats.vercel.app/api?username=Ahmed-ALTURUK&theme=rose_pine&show_icons=true&include_all_commits=true&count_private=true" > dist/stats.svg

      - name: Download Top Languages SVG
        run: curl -s "https://github-readme-stats.vercel.app/api/top-langs/?username=Ahmed-ALTURUK&theme=rose_pine&layout=compact&langs_count=5" > dist/languages.svg

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: Ahmed-ALTURUK
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
